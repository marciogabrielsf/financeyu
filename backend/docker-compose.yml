services:
  postgres:
    image: postgres:16-alpine
    container_name: financeyu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financeyu}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeyu-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-financeyu}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      PORT: 3000
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
    command: npm run dev

volumes:
  postgres_data:
